# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# Set the version of environment using UV
build:
   os: ubuntu-24.04
   tools:
      python: "3.12"
   jobs:
      pre_create_environment:
         - asdf plugin add uv
         - asdf install uv latest
         - asdf global uv latest
      create_environment:
         - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
      install:
         - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked  --extra advanced  --extra stat --extra deep --no-default-groups --group doc --group dev
      build:
         html:
            - ulimit -c 0 && cd docs/source && timeout --signal=ABRT --kill-after=10s 600s python -u -X faulthandler -m sphinx -T -b html -d _build/doctrees -D language=en . $READTHEDOCS_OUTPUT/html
