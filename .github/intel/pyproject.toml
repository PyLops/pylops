[project]
name = "pylops-intel-ci"
version = "0.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pylops[advanced,stat,deep]",
    "numpy>=2",
    "scipy>=1.13",
    "mkl-fft",
    "torch>=2",
    "pytest",
    "matplotlib",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
pylops = { path = "../..", editable = true }
numpy = { index = "intel" }
scipy = { index = "intel" }
mkl-fft = { index = "intel" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "intel"
url = "https://software.repos.intel.com/python/pypi"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
