name: PyLops Testing with Intel oneAPI Math Kernel Library(oneMKL)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - dev

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: .github/intel/uv.lock
      - name: Install the locked Intel environment
        run: uv sync --project .github/intel --locked
      - name: Check Intel NumPy and FFT backends
        run: |
          uv run --project .github/intel --no-sync python - <<'PY'
          import mkl_fft
          import numpy as np
          import pyfftw

          blas = np.show_config(mode="dicts")["Build Dependencies"]["blas"]
          assert "mkl" in blas["name"].lower(), blas
          samples = np.arange(8, dtype=float)
          reference = np.fft.fft(samples)
          np.testing.assert_allclose(mkl_fft.fft(samples), reference)
          np.testing.assert_allclose(pyfftw.interfaces.numpy_fft.fft(samples), reference)
          PY
      - name: Tests with pytest
        run: uv run --project .github/intel --no-sync pytest --color=yes pytests/
